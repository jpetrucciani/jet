[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
axum = "0.8"
bytemuck = { version = "1.25", features = ["derive"] }
fontdb = { version = "0.24", default-features = false, features = ["std", "fs", "memmap", "fontconfig"] }
harfrust = "0.16"
insta = "1.49"
jet-cli = { path = "crates/jet-cli" }
jet-config = { path = "crates/jet-config" }
jet-core = { path = "crates/jet-core" }
jet-font = { path = "crates/jet-font" }
jet-pty = { path = "crates/jet-pty" }
jet-render = { path = "crates/jet-render" }
libc = "0.2"
libghostty-vt = "0.2.2"
png = "0.18"
regex = "1"
resvg = { version = "0.50", default-features = false }
pollster = "1.0"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swash = "0.2.10"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync"] }
toml = "1"
wgpu = "30"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
windows = { version = "0.62", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Storage_Xps",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# One codegen unit and whole-program LTO: slower release builds for a
# faster jet. Debug builds are untouched.
[profile.release]
lto = "fat"
codegen-units = 1
