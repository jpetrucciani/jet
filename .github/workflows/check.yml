name: check

on:
  push:
    branches: [main]
  pull_request:

# nix-shell takes its bash from <nixpkgs> (without one, macOS's 3.2 fails):
# the same pin as default.nix, so keep the two in step.
env:
  NIXPKGS: https://github.com/jpetrucciani/nix/archive/7c182951459b46c656024aaae938648b806e8909.tar.gz

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each job runs a default.nix script, so CI and local checks are the same
# commands in the same dev shell.
jobs:
  linux:
    name: linux (fmt, clippy, tests, goldens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=${{ env.NIXPKGS }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
      - run: nix-shell --run check

  web:
    name: web UI (types in sync, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=${{ env.NIXPKGS }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - run: nix-shell --run check_web

  windows:
    name: windows (cross-compile, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=${{ env.NIXPKGS }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      # The MSVC CRT and SDK cargo-xwin downloads.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-v1
      - run: nix-shell --run check_win

  macos:
    name: macos (fmt, clippy, tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=${{ env.NIXPKGS }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - run: nix-shell --run check
