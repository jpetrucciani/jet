name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# nix-shell takes its bash from <nixpkgs> (without one, macOS's 3.2 fails):
# the same pin as default.nix, so keep the two in step.
env:
  NIXPKGS: https://github.com/jpetrucciani/nix/archive/7c182951459b46c656024aaae938648b806e8909.tar.gz

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

# Every push to main checks whether [workspace.package] version has a release
# yet, and publishes v<version> with binaries for all three platforms if its
# tag doesn't exist. So bumping the version releases it, a failed release is
# retried by the next push (or workflow_dispatch), and other pushes stop at
# detect. It is one workflow because a tag pushed with GITHUB_TOKEN triggers
# no other workflow, and the release (which creates the tag) only runs once
# every build has succeeded.
jobs:
  detect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          # ls-remote exits 2 when the tag is missing; anything else nonzero is a failed lookup.
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null || rc=$?
          case $rc in
            0) echo "v$version already exists; nothing to release"; release=false ;;
            2) release=true ;;
            *) exit "$rc" ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "release=$release" >>"$GITHUB_OUTPUT"

  # Each build runs a default.nix dist_* script, so a release is built the
  # same way locally.
  linux:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    # dist_linux links against the runner's glibc, so this image sets the
    # oldest distro the binaries run on. Keep it the oldest Ubuntu available.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=${{ env.NIXPKGS }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux
          workspaces: |
            . -> target/portable
            . -> target/pgo/build
      - run: nix-shell --run dist_linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/dist/*.tar.gz
          if-no-files-found: error

  # jetmux runs on servers: static musl binaries for any x86_64 Linux.
  jetmux:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=${{ env.NIXPKGS }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-jetmux
      - run: nix-shell --run dist_jetmux
      - uses: actions/upload-artifact@v4
        with:
          name: jetmux
          path: target/dist/jetmux-*.tar.gz
          if-no-files-found: error

  # A PGO profile only fits the target it was recorded on, so Windows's is
  # recorded on Windows: an instrumented build from Linux runs there, and
  # the release build uses what it recorded.
  windows-pgo-build:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=${{ env.NIXPKGS }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-pgo
          workspaces: '. -> target/pgo/win-build'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-v1
      - run: nix-shell --run pgo_win_bundle
      - uses: actions/upload-artifact@v4
        with:
          name: windows-pgo-bundle
          path: target/pgo/win-bundle
          if-no-files-found: error

  windows-pgo-run:
    needs: windows-pgo-build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-pgo-bundle
          path: bundle
      - run: bundle\run.cmd
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: windows-pgo-raw
          path: bundle/raw/*.profraw
          if-no-files-found: error

  # Signed through Azure Trusted Signing when the repo has its variables
  # (JET_SIGN_ENDPOINT, JET_SIGN_ACCOUNT, JET_SIGN_PROFILE, and AZURE_CLIENT_ID,
  # AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID for a federated login); unsigned
  # otherwise.
  windows:
    needs: windows-pgo-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=${{ env.NIXPKGS }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows
      # The MSVC CRT and SDK cargo-xwin downloads.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-v1
      - uses: actions/download-artifact@v4
        with:
          name: windows-pgo-raw
          path: target/pgo/win-raw
      - if: vars.JET_SIGN_ACCOUNT != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - if: vars.JET_SIGN_ACCOUNT != ''
        run: |
          token=$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)
          echo "::add-mask::$token"
          echo "JET_SIGN_TOKEN=$token" >>"$GITHUB_ENV"
      - run: nix-shell --run 'dist_win && win_manifests'
        env:
          JET_SIGN_ENDPOINT: ${{ vars.JET_SIGN_ENDPOINT }}
          JET_SIGN_ACCOUNT: ${{ vars.JET_SIGN_ACCOUNT }}
          JET_SIGN_PROFILE: ${{ vars.JET_SIGN_PROFILE }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/dist/*.zip
            target/dist/*.msi
            target/dist/jet.json
          if-no-files-found: error
      # Not a release asset: the files for a microsoft/winget-pkgs PR.
      - uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: target/winget
          if-no-files-found: error

  macos:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=${{ env.NIXPKGS }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos
          workspaces: |
            . -> target/portable
            . -> target/pgo/build
      - run: nix-shell --run dist_mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/dist/*.zip
          if-no-files-found: error

  release:
    needs: [detect, linux, jetmux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '{linux,jetmux,windows,macos}'
          merge-multiple: true
      # gh creates the tag at this commit along with the release.
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          ls -l dist
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "jet $VERSION" \
            --generate-notes
