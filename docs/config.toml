# jet's config, every key at its default. Copying this file as-is changes
# nothing; uncomment and edit what you want. A test loads this file, so it
# stays in step with what jet accepts.
#
# Where jet looks (the first that exists):
#   $JET_CONFIG
#   ~/.jet/config.toml                      (every platform)
#   %APPDATA%\jet\config.toml               (Windows)
#   $XDG_CONFIG_HOME/jet/config.toml, else ~/.config/jet/config.toml
#
# `jet config check` prints the files read, any warnings, and the effective
# config. Edits apply as soon as the file is saved; a config that doesn't
# load keeps the previous one and shows a banner.
#
# Colors are "#rrggbb", "rrggbb" or "#rgb". Sizes in DIPs are pixels at 100%
# display scaling. "Windows only" keys are accepted elsewhere and ignored, so
# one file serves every machine.

# More configs layered on top of this one, in order: each wins over this
# file and the ones before it, and tables like [profiles] combine. Paths are
# relative to this file or start with ~/. Missing files are skipped (`jet
# config check` lists them) and picked up once they appear, so a managed
# config.toml can include a per-machine file that may not exist yet.
include = []                  # e.g. ["local.toml"]

[font]
# family = "JetBrains Mono"   # an installed family, any case; unset or not
                              # found: the bundled JetBrains Mono
size = 12.0                   # points
features = []                 # OpenType features over the defaults:
                              # ["-calt"] drops ligatures, ["ss01", "zero"]

[theme]
# name = "Poimandres"         # one of Ghostty's ~900 themes, built in (the
                              # palette's Choose theme previews them), or
                              # your own: a path, or a file name in themes/
                              # beside this config or Ghostty's, which wins
                              # over a built-in one of that name. [colors]
                              # below override it.
# light = "Nu Disco Light"    # in place of name while the system is in
# dark = "Nu Disco Dark"      # light or dark mode, switching when it does
                              # (Windows and macOS; Linux counts as dark).
                              # Choose theme writes the one in effect

[colors]
# foreground = "#a6accd"      # unset: jet's defaults, or the theme's
# background = "#1b1e28"
# cursor = "#add7ff"          # unset: jet's default, or the theme's
# selection-background = "#303340"   # unset: a blue tint over each cell,
# selection-foreground = "#ffffff"   # text keeping its color; or the theme's
# palette = { 0 = "#1b1e28", 1 = "#d0679d", 2 = "#5de4c7" }   # any of 0-255

[window]
padding = 4                   # DIPs around the grid
columns = 100                 # initial size, in cells
rows = 30
opacity = 1.0                 # of the default background only; text and
                              # colored cells stay solid
decorations = "system"        # system: the OS's title bar
                              # custom: jet's, with the tabs in it (macOS keeps
                              #   its traffic lights; restart to switch there)
                              # none: no title bar; drag by the tab bar
color-scheme = "auto"         # auto (from the background) | dark | light:
                              # the frame, buttons and backdrop
backdrop = "none"             # Windows only, with opacity < 1:
                              # none | mica | acrylic | tabbed
corners = "default"           # Windows only: default | round | small | square
titlebar-color = "background" # Windows only: background | system | #rrggbb
border-color = "system"       # Windows only: system | none | background | #rrggbb
taskbar-progress = true       # Windows only: OSC 9;4 progress on the taskbar
low-latency = false           # Windows only: present without waiting for
                              # vblank, so typing shows ~3 ms sooner; a frame
                              # can tear. Read at start
restore = false               # reopen the tabs, splits and each shell's
                              # directory the last window closed with (the
                              # shells, not what ran in them). Not quake's
# profile = "bash"            # what a new window's first tab runs: a
                              # [profiles] name (not a jetmux one); unset:
                              # [shell] profile
confirm-close = true          # ask before closing a tab, split or window
                              # with something besides its shell running
unfocused-split-opacity = 0.7 # splits without the keyboard fade to this;
                              # 1 leaves them as they are

[tab-bar]
show = "auto"                 # auto (2+ tabs) | always | never
position = "top"              # top | bottom | left | right
width = 24                    # cells, when left or right
# background = "#1b1e28"      # unset: from the terminal's colors
# foreground = "#a6accd"
# active-background = "#303340"
# active-foreground = "#ffffff"
color-style = "fill"          # how a profile's tab-color shows: fill (the
                              # tab, dimmer when inactive) | top | bottom |
                              # left | right (a line on that edge) | dot
                              # (before the title) | text (the title)

[shell]
# command = "pwsh -NoLogo"    # a line (double quotes group; backslashes are
                              # literal) or an argv array:
                              # ["C:/Program Files/Git/bin/bash.exe", "-l"]
                              # unset: pwsh, else Windows PowerShell, else cmd
                              # on Windows; the login shell elsewhere
# icon = "🐚"                 # before its tabs' titles: any text, an .svg
                              # file (~/ or beside this config), or inline
                              # '<svg viewBox="0 0 24 24">...</svg>'
follow-ssh = false            # a new tab or split from a pane running ssh
                              # runs that ssh again (same options; the
                              # system's ssh), in the directory the remote
                              # shell last reported (OSC 7). Pair with
                              # ControlMaster in ~/.ssh/config to skip
                              # logging in again. Same for wsl.exe: the same
                              # distro and user, with --cd to that directory
integration = true            # bash (4+), zsh and PowerShell started in jet
                              # mark prompts (OSC 133) and report their
                              # directory without any setup in your dotfiles.
                              # Commands that run a script are left alone
# profile = "bash"            # what new tabs and splits run when none is
                              # named: a [profiles] name (not a jetmux one);
                              # unset: the command above

# Named shells, opened with new_tab:<name> or new_split:<side>:<name>.
# [profiles.ubuntu]
# command = "wsl.exe -d Ubuntu"   # unset: [shell]'s
# icon = "🐧"
# cwd = "C:/src"                  # unset: where the focused shell is
#
# [profiles.voyager]               # straight into a box, no shell in between
# command = "ssh voyager"
# theme = "Red Alert"              # its panes' theme, like [theme] name; the
#                                  # title and tab bars follow while focused
# colors.background = "#2a0000"    # its panes' colors, over theme's, then
#                                  # [colors]: every [colors] key works
# tab-color = "#cc3333"            # its tabs, per [tab-bar] color-style
# color-style = "fill"             # or its own, over [tab-bar]'s
#
# [profiles.claude]                # an agent that rings when it needs you
# command = "claude"
# bell-sound = "~/sounds/claude.ogg"        # its panes' sounds, over
# notification-sound = "~/sounds/done.mp3"  # [terminal]'s
#
# [profiles.dev]                   # a jetmux session: its tabs and splits show
# jetmux = { host = "voyager", session = "main", up = "dev" }
#                                  # as jet's. host: over `ssh -T`, unset for
#                                  # this machine's daemon (not on Windows); up:
#                                  # the host's jetmux profile to start it from
#                                  # if it isn't running; program: jetmux's path
#                                  # there when ssh's PATH lacks it (~/ works
#                                  # over ssh), unset: PATH. icon: as above,
#                                  # unset: a split-pane mark. Opening it again
#                                  # adds a tab to the session

# Looks by host, over the pane's profile's: for panes whose {host} (as the
# status shows it: where the shell says it is, else the ssh in front, else
# this computer) matches a rule's regex. The first match by name wins.
# theme, colors, tab-color and color-style work as in a profile. A host
# reached by ssh shows once the pane has been in front.
# [hosts.prod]
# match = '^prod-'
# tab-color = "#cc3333"
# theme = "Red Alert"

[terminal]
scrollback = 10000            # lines of history
copy-on-select = true         # selecting copies to the clipboard
clipboard-write = true        # programs may set the clipboard (OSC 52, as tmux
                              # and Neovim do over SSH); they can never read it
notifications = true          # desktop notifications programs ask for (OSC 9,
                              # OSC 777), except from the pane you're looking
                              # at; kitty's OSC 99 picks when to show (o=)
paste-protection = true       # ask before pasting a newline where it would
                              # run (a program without bracketed paste, like
                              # a plain prompt)
bell = ["flash", "attention"] # flash: the window, when it's in front;
                              # attention: the taskbar button (the Dock icon
                              # bounces), when it isn't; sound: bell-sound,
                              # else the system alert (Windows only). []
                              # ignores the bell
# bell-sound = "~/sounds/ding.ogg" # a file the bell plays: wav, mp3, ogg or
                              # flac; setting it turns sound on. `~/` and
                              # paths next to this file work, and forward
                              # slashes on Windows. Missing or unplayable,
                              # the window says so and the system alert
                              # plays. Linux plays through ALSA (libasound)
# notification-sound = "~/sounds/chime.mp3" # what notifications (OSC 9,
                              # OSC 777) play when they'd show, shown or not
sound-volume = 1.0            # those sounds' volume, 0 to 1. A sound asked
                              # for while one plays is skipped

[cursor]
style = "block"               # block | bar | underline
blink = true

# Plumbing, after Plan 9's plumber: Ctrl+click text a rule's regex matches
# (it's underlined while hovered) and the rule acts on it. Where several
# match, the longest match wins. Rules are named so an include can replace
# one. Each has exactly one action:
#   open = "URL"        opened here by the system (http, https, mailto)
#   run = [...]         a program run here in the background
#   view = [...]        a split running it where the pane is: over the
#                       pane's ssh, in the remote shell's directory (OSC 7),
#                       else here; in = "right" | "down" | "left" | "up" | "tab"
# {0} is the whole match, {name} a (?<name>...) group, {cwd} and {host} the
# pane's. Each word is filled on its own and quoted for the remote shell, so
# text on screen can't add words or commands. on = "any" | "local" |
# "remote" (ssh in front) picks which panes a rule is for. Rules come
# before the built-in URL opening.
#
# [plumb.issue]
# match = '#(?<n>\d+)'
# open = "https://github.com/me/repo/issues/{n}"
#
# [plumb.code]                    # file:line here: your editor
# match = '(?<file>[\w./-]+\.\w+):(?<line>\d+)'
# on = "local"
# run = ["code", "--goto", "{file}:{line}"]   # Windows: ["cmd", "/c", "code", ...]
#
# [plumb.code-remote]             # file:line over ssh: an editor split there
# match = '(?<file>[\w./-]+\.\w+):(?<line>\d+)'
# on = "remote"
# view = ["nvim", "+{line}", "{file}"]
#
# [plumb.commit]
# match = '\b[0-9a-f]{7,40}\b'
# view = ["git", "show", "{0}"]
# in = "down"

# Segments about the focused pane, in the title bar, tab bar or a row of
# their own. None by default.
[status]
position = "titlebar"         # titlebar: beside the window buttons, with
                              #   decorations = "custom" (else bottom)
                              # tab-bar: the tab bar's end
                              # top | bottom: a row of their own
style = "powerline"           # powerline | round | plain

# A segment hides while any {field} in it is empty. Fields:
#   {title}             what the shell set as the title
#   {cwd} {dir}         where the shell is (OSC 7, remote paths too), and
#                       just its last part
#   {host} {user}       where and as whom the innermost context runs: sudo,
#                       a container or ssh (OSC 3008, OSC 7), else this
#                       computer and you
#   {ssh}               user@host of an ssh in front; empty otherwise
#   {context}           what the innermost OSC 3008 context changed: the
#                       sudo user, the container, VM or remote host
#   {process}           the program in front
#   {profile}           the pane's profile, "default" for the shell
#   {tab} {tabs}        the tab's number, and how many there are
#   {time} {date}       local HH:MM and YYYY-MM-DD
#   {progress}          42% while a program reports progress (OSC 9;4)
#   {exit}              the last command's status when it failed (shells
#                       that send OSC 133)
#   {var.NAME}          a user variable, set with OSC 1337 SetUserVar
# {{ and }} are literal braces. More in docs/status.md.
#
# [[status.segments]]
# text = "{user}@{host}"
# background = "#5de4c7"      # unset: alternating shades of the bar
# foreground = "#1b1e28"
# align = "right"             # left | right, in a top or bottom row
#
# [[status.segments]]
# text = "⎈ {var.k8s}"
#
# [[status.segments]]
# text = "{time}"

# `jet quake`: a window a global hotkey shows and hides. Running `jet quake`
# again toggles it too: on Linux, which has no hotkey here, bind that in
# your desktop's shortcuts (it runs on X11 or XWayland). On Windows it has
# a tray icon (under the taskbar's ^ until you pin it there): click to
# toggle, right click to toggle one window or quit.
[quake]
hotkey = "ctrl+space"         # a chord as in [keybinds], or a list of them
                              # (Windows); Windows and macOS
                              # ("ctrl+grave" there: Ctrl+Space switches input
                              # sources). Ctrl+Space is also Windows' CJK IME
                              # toggle; "super+grave" avoids it
hotkey-hook = false           # Windows: also catch it with a keyboard hook,
                              # for games that turn hotkeys off while in
                              # front (League of Legends; the Win key dies
                              # there too). Swallows the chord there; not
                              # over windows running as admin
monitor = "cursor"            # cursor (the one under the mouse) | primary
x = 0.0                       # placement as fractions of the monitor's work
y = 0.0                       # area: the left third is width = 0.333,
width = 1.0                   # height = 1.0
height = 0.45
# profile = "bash"            # what its first tab runs: a [profiles] name
                              # (not a jetmux one); unset: [window] profile,
                              # else [shell]'s
hide-on-blur = true           # hide when another window takes the focus
                              # (not another quake window: they hide when
                              # the focus leaves them all)
always-on-top = true
taskbar = false               # show in the taskbar and Alt+Tab (macOS: the
                              # Dock, read at start, and clicking it toggles;
                              # ignored on Linux)
over-taskbar = false          # Windows only: x, y, width and height are of
                              # the whole monitor, so it can cover the taskbar
autostart = true              # Windows and macOS: keep `jet quake` running,
                              # started at sign-in (macOS: a launchd agent,
                              # ~/Library/LaunchAgents/dev.jet.quake.plist)
                              # and by any jet window that finds it isn't
                              # (hidden until the hotkey)

# More quake windows: [quake.NAME] tables, each one a window of its own
# with [quake] under what it sets (all but autostart and hotkey-hook,
# which are for every window). Windows that share a hotkey show and hide
# together, focusing the one last used; `hotkey` can be a list, for one
# that also has a key of its own. `jet quake NAME` toggles one, the tray
# icon lists them. Windows only for now; elsewhere the first one is used.
#
# [quake.left]                # left and right drop together on ctrl+space
# width = 0.3
# height = 1.0
# profile = "work"
# [quake.right]
# x = 0.7
# width = 0.3
# height = 1.0
# hotkey = ["ctrl+space", "ctrl+alt+r"]

# Ghostty's chord and action names, so `keybind = ...` lines carry over.
# Modifiers: ctrl, shift, alt (opt), super (cmd, win). Keys: a-z, 0-9,
# f1-f24, enter, tab, escape, space, backspace, delete, insert, home, end,
# page_up, page_down, left, right, up, down, equal (plus), minus, comma,
# period, slash, semicolon, quote, bracket_left, bracket_right, backslash,
# grave.
#
# Actions: copy_to_clipboard, paste_from_clipboard, new_tab[:profile],
# close_surface, close_tab, next_tab, previous_tab, goto_tab:N, last_tab,
# new_split:right|down|left|up[:profile], goto_split:left|right|up|down|
# previous|next, increase_font_size:PT, decrease_font_size:PT,
# reset_font_size, jump_to_prompt:N (negative is up) and copy_command_output
# (both need a shell that marks prompts with OSC 133; unbound by default for
# the latter), start_search, end_search, navigate_search:next|previous (next
# goes up, to older output), copy_mode, quick_select, toggle_command_palette,
# toggle_split_zoom, resize_split:left|right|up|down[:PERCENT] (moves the
# nearest divider that way, 5% of its split by default), equalize_splits,
# rename_tab (an empty name gives the tab back its shell title),
# set_tab_color (a palette of colors for the tab, over its profile's and
# host's; also set_tab_color:#rrggbb, and set_tab_color:none to go back),
# move_tab:N (negative is left; unbound by default, like rename_tab),
# reload_config, ignore (swallow the key), unbind (give it back to the
# program), copy_version (jet's version, also in the palette as About),
# open_config (in your editor; a new file starts as this one, commented
# out), choose_theme (a palette of the themes found, previewed as you move;
# Enter writes it to the config), new_tab_menu (the profiles, as on a right
# click of the tab bar), reset_quake (the quake window back to its [quake]
# place after dragging it by the tab bar or sizing it from an edge),
# detach (take the focused jetmux session's tabs out of jet, still running
# there; closing a jetmux tab or split closes it there too),
# text:TEXT (send it as if typed; \r \n \t \e \xHH \u{HHHH}
# escapes, so "ctrl+enter" = 'text:\r' makes Ctrl+Enter a plain Enter).
#
# The find bar searches the focused pane's screen and history as you type,
# matching case only when the query has capitals. Enter or Up goes to the
# match above, Shift+Enter or Down the one below, Alt+R switches between
# text and regular expressions (Rust regex syntax), Escape closes it. The
# palette runs any of the actions above by name.
#
# Copy mode (ctrl+shift+x, cmd+shift+x) puts a cursor on the focused pane:
# h j k l and the arrows, w b e, 0 ^ $, g G, H M L, Ctrl+U/D, Ctrl+B/F and
# Page Up/Down move it (into history too); v selects, V whole lines, Ctrl+V
# a block, o swaps ends; y or Enter copies, Escape or q leaves.
# Quick select (ctrl+shift+space, cmd+shift+space) labels the URLs, paths,
# git hashes and IP addresses in view: type a label to copy it, in capitals
# to also type it into the pane; Escape leaves.
[keybinds]
# defaults = false            # start from no bindings at all
#
# The defaults on Windows and Linux:
# "ctrl+shift+c" = "copy_to_clipboard"
# "ctrl+insert" = "copy_to_clipboard"
# "ctrl+shift+v" = "paste_from_clipboard"
# "shift+insert" = "paste_from_clipboard"
# "ctrl+t" = "new_tab"        # unbind it to give Ctrl+T back to fzf/readline
# "ctrl+shift+t" = "new_tab"
# "ctrl+shift+w" = "close_surface"
# "ctrl+tab" = "next_tab"
# "ctrl+shift+tab" = "previous_tab"
# "ctrl+page_down" = "next_tab"
# "ctrl+page_up" = "previous_tab"
# "alt+1" = "goto_tab:1"      # through alt+8
# "alt+9" = "last_tab"
# "ctrl+shift+o" = "new_split:right"
# "ctrl+shift+e" = "new_split:down"
# "ctrl+alt+left" = "goto_split:left"   # and right, up, down
# "ctrl+shift+bracket_left" = "goto_split:previous"
# "ctrl+shift+bracket_right" = "goto_split:next"
# "ctrl+equal" = "increase_font_size:1"
# "ctrl+plus" = "increase_font_size:1"
# "ctrl+minus" = "decrease_font_size:1"
# "ctrl+0" = "reset_font_size"
# "ctrl+shift+page_up" = "jump_to_prompt:-1"
# "ctrl+shift+page_down" = "jump_to_prompt:1"
# "ctrl+shift+f" = "start_search"
# "ctrl+shift+x" = "copy_mode"
# "ctrl+shift+space" = "quick_select"
# "ctrl+shift+p" = "toggle_command_palette"
# "ctrl+shift+enter" = "toggle_split_zoom"
# "ctrl+shift+alt+left" = "resize_split:left"   # and right, up, down
# "ctrl+shift+alt+equal" = "equalize_splits"
# "ctrl+shift+alt+d" = "detach"  # on a jetmux tab; nothing elsewhere
#
# On macOS they're Command chords instead, as in Ghostty: cmd+c, cmd+v,
# cmd+t, cmd+w, cmd+1..9, cmd+d / cmd+shift+d (split right / down),
# cmd+alt+arrows, cmd+[ and cmd+], cmd+shift+[ and cmd+shift+] (tabs),
# cmd+= / cmd+- / cmd+0, cmd+up / cmd+down (prompts), cmd+f, cmd+g and
# cmd+shift+g (search), cmd+shift+x (copy mode), cmd+shift+space (quick
# select), cmd+shift+p (palette), cmd+shift+enter (zoom), cmd+ctrl+arrows
# (resize splits), cmd+ctrl+= (equalize), cmd+shift+alt+d (detach),
# plus ctrl+tab.
#
# Your own, for example:
# "ctrl+shift+d" = "new_split:right"
# "ctrl+shift+u" = "new_tab:ubuntu"
# "ctrl+t" = "unbind"

# Ghostty settings, passed through. If config-file is unset and a Ghostty
# config exists (~/.config/ghostty/config or config.ghostty,
# %LOCALAPPDATA%\ghostty\ on Windows, ~/Library/Application Support/
# com.mitchellh.ghostty/ on macOS), jet imports it. Keys above win over
# keys here, which win over the imported file. Supported: font-family,
# font-size, font-feature, theme, palette, background, foreground,
# cursor-color, selection-background/foreground, background-opacity,
# window-padding-x/y, command, keybind (`keybind = clear` is [keybinds]
# defaults = false), cursor-style, cursor-style-blink,
# copy-on-select, clipboard-write, desktop-notifications,
# clipboard-paste-protection, confirm-close-surface, unfocused-split-opacity.
# Others log a warning and are ignored.
[ghostty]
# config-file = "~/.config/ghostty/config"   # or false to skip the import
# cursor-style = "bar"
# font-feature = ["-calt"]

# jetmux's settings, for keeping both programs in this one file: every key
# from docs/jetmux.toml, without the shared [theme], [colors] and [status],
# which jetmux reads from here too (and from anything `include` brings in).
# ~/.config/jetmux/config.toml, if it exists, goes on top and wins.
# [jetmux]
# prefix = "C-a"
#
# [jetmux.bar]
# style = "powerline"
