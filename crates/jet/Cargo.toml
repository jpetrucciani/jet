[package]
name = "jet"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jet-cli.workspace = true
jet-config.workspace = true
jet-core.workspace = true
jet-font.workspace = true
jet-pty.workspace = true
jet-render.workspace = true
jetmux-proto = { path = "../jetmux-proto" }
libghostty-vt.workspace = true
resvg.workspace = true
rodio.workspace = true
serde.workspace = true
serde_json.workspace = true
wgpu.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rodio = { workspace = true, features = ["playback"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
arboard.workspace = true
libc.workspace = true
winit.workspace = true

[lints]
workspace = true
